<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>違建大亨 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/*
VOICE: 一本正經的冷面解謎，像建築系的結構作業被做成桌上模型
IDEA: 一座握在手機裡的街角模型：阿公的老公寓站在一小塊轉角地上，屋頂是解謎盤
PICTURE: 固定等角視角的像素材質 3D 模型，天空隨章節從早晨走到深夜
COLOUR and TYPE: 深夜藍框、米白紙、招牌紅、安全黃；DotGothic16 數字＋Noto Sans TC
LAYOUT: 手機直式：上方標題列，中間舞台佔滿，下方零件列與大顆驗收鈕，全部在拇指範圍
*/
:root{color-scheme:light dark;--bg:light-dark(#efe6d6,#12161f);--panel:light-dark(#fbf6ec,#1e2430);--ink:light-dark(#1f1c18,#f1ead9);--quiet:light-dark(#6e665a,#a8a08f);--line:light-dark(#d7cbb6,#353d4d);--navy:#1c2a44;--deep:#0d1526;--yel:#f4c430;--red:#d8382c;--ok:#3f9b57;--blue:#3e78b2}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.px{font-family:"DotGothic16","Noto Sans TC",monospace}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.col{max-width:560px;margin:0 auto}

/* 按鈕 */
.b{min-height:44px;padding:4px 10px;border:3px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s,background .12s}
.b:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.b:disabled{opacity:.4}
.b.on{background:var(--blue);color:#fff;border-color:#24486b;box-shadow:0 4px 0 #24486b}
.b.go{background:var(--red);border-color:#7f1a13;color:#fff;box-shadow:0 5px 0 #7f1a13;font-size:18px;letter-spacing:2px;min-height:52px}
.b.go:active:not(:disabled){box-shadow:0 0 0 #7f1a13;transform:translateY(5px)}
.b.sm{font-size:13px;border-width:2px;box-shadow:0 3px 0 var(--line);padding:2px 4px}
.b.sm:active:not(:disabled){transform:translateY(3px)}

/* 選關 */
#menu{padding:10px 10px 40px}
.hero{background:var(--navy);color:#f6efe0;border:4px solid var(--deep);box-shadow:0 6px 0 var(--deep);overflow:hidden}
#heroSlot{position:relative;height:min(62vw,340px)}
#heroSlot canvas,#stageSlot canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;outline:0;touch-action:none}
.hero .txt{padding:14px 18px 18px}
.hero h1{font:400 clamp(32px,9.5vw,46px)/1.05 "DotGothic16","Noto Sans TC",monospace;margin:0;letter-spacing:2px;text-shadow:3px 3px 0 var(--red)}
.hero p{color:#cdd6e6;margin:8px 0 0}
.hero .tot{margin-top:10px;font:400 20px "DotGothic16",monospace;color:var(--yel)}
.chap{margin:22px 2px 10px;font:400 19px "DotGothic16","Noto Sans TC",monospace;display:flex;align-items:baseline;justify-content:space-between}
.chap small{color:var(--yel);font-size:15px;text-shadow:0 1px 0 #8a6a00}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{display:grid;grid-template-columns:1fr auto;gap:0 6px;text-align:left;padding:10px 12px;min-height:86px;border:3px solid var(--line);background:var(--panel);cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.lv:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.lv b{font:400 12px "DotGothic16",monospace;color:var(--quiet)}
.lv .n{grid-column:1;font-weight:700;font-size:15.5px;line-height:1.3}
.lv .st{grid-column:1;font-size:18px;letter-spacing:2px;color:var(--yel);text-shadow:0 1px 0 #8a6a00}
.lv .st i{font-style:normal;color:var(--line);text-shadow:none}
.lv .mini{grid-column:2;grid-row:1/4;align-self:center;display:grid;gap:1px;transform:rotate(-45deg) scale(.85)}
.lv .mini i{width:8px;height:8px;background:var(--blue);opacity:.75}
.lv .mini i.v{background:transparent}
.rules{margin-top:22px;background:var(--panel);border:2px solid var(--line);padding:12px 14px}
.rules h2{font:400 18px "DotGothic16","Noto Sans TC",monospace;margin:0 0 6px}
.rules ol{margin:0;padding-left:22px}
.rules li{margin:3px 0}

/* 遊戲：佔滿一個畫面，不用捲動 */
#game{display:none;height:100vh;height:100dvh;flex-direction:column;gap:6px;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.top{flex:none;display:flex;align-items:center;gap:6px;background:var(--navy);color:#f6efe0;padding:5px 6px;border:3px solid var(--deep)}
.top h2{margin:0;font:400 17px/1.15 "DotGothic16","Noto Sans TC",monospace;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h2 small{font-size:12px;color:#9fb0cc;margin-left:6px}
.top .b{background:#26375a;border-color:#3b4c6b;color:#f6efe0;box-shadow:0 3px 0 var(--deep);min-width:44px;min-height:40px}
.stageWrap{flex:1;position:relative;border:3px solid var(--deep);min-height:260px;overflow:hidden;background:#9fd0f0}
.sky-morning{background:linear-gradient(#8fd0f5,#d9f0fa 62%,#f7efd8)}
.sky-noon{background:linear-gradient(#4fa3e8,#a9dcf7 60%,#e9f6fb)}
.sky-dusk{background:linear-gradient(#3b3a78,#c96a66 45%,#f2a35e 70%,#f9d08f)}
.sky-night{background:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 31% 9%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 54% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 28%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 43% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 8% 42%,#fff 50%,transparent 51%),linear-gradient(#0a1030,#1f2a5a 60%,#4a3f78)}
.orb{position:absolute;width:46px;height:46px;border-radius:50%;right:8%;top:17%;background:#fff6c8;box-shadow:0 0 0 10px rgba(255,246,200,.25),0 0 50px 16px rgba(255,240,180,.35)}
.sky-dusk .orb{background:#ffb26b;top:46%;right:5%;box-shadow:0 0 0 10px rgba(255,178,107,.25),0 0 70px 24px rgba(255,160,90,.4)}
.sky-night .orb{background:#eef1ff;width:36px;height:36px;box-shadow:inset -8px -5px 0 #c9cfe8,0 0 36px 8px rgba(200,210,255,.25)}
.cloud{position:absolute;left:-110px;width:12px;height:6px;background:#fff;opacity:.9;box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,48px 0 #fff,12px -6px #fff,24px -6px #fff,36px -6px #fff,24px -12px #fff,60px 0 #fff;animation:drift linear infinite}
.cloud.c1{top:22%;animation-duration:70s}.cloud.c2{top:36%;animation-duration:110s;animation-delay:-50s;transform:scale(.7)}.cloud.c3{top:15%;animation-duration:90s;animation-delay:-25s;transform:scale(1.25)}
.sky-dusk .cloud{background:#ffd9b0;box-shadow:12px 0 #ffd9b0,24px 0 #ffd9b0,36px 0 #ffd9b0,48px 0 #ffd9b0,12px -6px #ffd9b0,24px -6px #ffd9b0,36px -6px #ffd9b0,24px -12px #ffd9b0,60px 0 #ffd9b0}
.sky-night .cloud{opacity:.16}
@keyframes drift{to{left:105%}}
#stageSlot{position:absolute;inset:0}
#labels,#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-50%);font:11px/1 "DotGothic16",monospace;padding:1px 3px;border:1px solid #101828;border-radius:3px;white-space:nowrap}
.lab.g{background:#6fd083;color:#0d1a10}.lab.y{background:#f4c430;color:#1d1600}.lab.r{background:#d8382c;color:#fff;animation:blink .5s steps(2) infinite}
.lab.up{outline:2px solid #fff}
@keyframes blink{50%{background:#fff;color:#d8382c}}
.pop{position:absolute;transform:translate(-50%,-50%);font:400 24px "DotGothic16",monospace;color:#fff;text-shadow:0 2px 0 #1b2233,0 0 6px rgba(0,0,0,.6);animation:pop .9s ease-out forwards;white-space:nowrap}
.pop.plus{color:#ffe36e}.pop.minus{color:#ff8a80}
@keyframes pop{0%{opacity:0;margin-top:8px;scale:.6}15%{opacity:1;scale:1.3}30%{scale:1}100%{opacity:0;margin-top:-50px}}
.hud{z-index:3;position:absolute;left:0;right:0;top:0;background:rgba(13,21,38,.86);color:#f6efe0;padding:5px 10px 6px;display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center}
.hud .num{font:400 32px/1 "DotGothic16",monospace;color:var(--yel);display:inline-block}
.hud .num.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.4)}}
.hud small{color:#cdd6e6;margin-left:3px;font-size:12px}
.hud .delta{font:400 15px "DotGothic16",monospace;margin-left:5px}
.hud .delta.p{color:#7ee08f}.hud .delta.m{color:#ff8a80}
.goal{display:flex;gap:10px;justify-content:flex-end;font:400 13px "DotGothic16",monospace;color:#6f82a6;white-space:nowrap}
.goal span.hit{color:var(--yel)}
.meterBar{position:relative;height:8px;background:#26375a;margin:4px 0 0}
.meterBar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#f4c430,#ffe36e);transition:width .3s cubic-bezier(.2,1.2,.4,1)}
.meterBar b{position:absolute;top:-3px;width:3px;height:14px;margin-left:-1px;background:#6f82a6}
.meterBar b.hit{background:#fff}
.chips{z-index:3;position:absolute;left:6px;right:6px;top:50px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;font-size:12px;font-weight:700;padding:3px 7px;border:2px solid #101828;background:rgba(251,246,236,.94);color:#1f1c18;border-radius:12px;display:flex;gap:3px;align-items:center;transition:transform .12s,background .15s}
.chip i{font-style:normal;font-weight:900}
.chip.ok i{color:var(--ok)}.chip.bad{background:#d8382c;color:#fff}.chip.warn{background:#f4c430}
.chip.run{transform:scale(1.18);background:#fff3b0}
.chip.pass{background:#bfe8c8}
#tip{z-index:3;position:absolute;left:0;right:0;bottom:0;background:rgba(13,21,38,.86);color:#f6efe0;padding:6px 10px;font-size:13px;line-height:1.4;min-height:32px;pointer-events:none}
#tip.bad{background:rgba(150,28,20,.92);animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#tip b{color:var(--yel)}
#tip .w{color:#ffb3ab;font-weight:700}
#bRot{z-index:3;position:absolute;right:8px;bottom:46px;display:none}

/* 零件列 */
.dock{flex:none;display:flex;gap:7px;overflow-x:auto;padding:10px 4px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dock::-webkit-scrollbar{display:none}
.piece{flex:none;width:74px;display:grid;justify-items:center;padding:2px 2px 4px;border:3px solid var(--line);background:var(--panel);cursor:pointer;position:relative;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,border-color .1s}
.piece img,.piece canvas{width:46px;height:46px}
.piece .nm{font-weight:700;font-size:12.5px;line-height:1.2;white-space:nowrap}
.piece .sp{font:400 10.5px "DotGothic16",monospace;color:var(--quiet);white-space:nowrap}
.piece .ct{position:absolute;right:-5px;top:-8px;min-width:24px;text-align:center;font:400 13px "DotGothic16",monospace;background:var(--navy);color:#fff;border:2px solid var(--deep);padding:0 3px}
.piece .ct.bump{animation:bump .25s}
.piece.on{border-color:var(--blue);transform:translateY(-6px);box-shadow:0 10px 0 #24486b;background:color-mix(in srgb,var(--blue) 16%,var(--panel))}
.piece.zero{opacity:.42}
.piece.zero .ct{background:#777}
.piece.er{border-style:dashed}
.row{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row2{flex:none;display:grid;grid-template-columns:1fr;gap:6px}

/* 平面圖：蓋在舞台上，和 3D 畫面切換 */
.planView{position:absolute;inset:0;padding:84px 8px 66px;z-index:2;background:color-mix(in srgb,var(--panel) 93%,transparent);display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.planView.show{display:flex;animation:fade .15s}
.planView .legend{font-size:11.5px;color:var(--quiet);margin:0;text-align:center;line-height:1.35}
.plan{position:relative;flex:none}
.pgrid{position:absolute;left:50%;top:50%;display:grid;transform:translate(-50%,-50%) rotate(-45deg)}
.pc{border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 7%,transparent);padding:0;display:grid;place-items:center}
.pc span{transform:rotate(45deg);font:400 14px "DotGothic16",monospace;pointer-events:none}
.pc.ring{border-style:dashed;background:transparent;opacity:.6}
.pc.void{background:repeating-linear-gradient(45deg,transparent 0 3px,color-mix(in srgb,var(--ink) 25%,transparent) 3px 4px)}
.pc.sb{box-shadow:inset 0 0 0 2px #ff9a3c}
.pc.hov{outline:3px solid var(--yel);outline-offset:-2px;z-index:2;opacity:1}
.pc.t-tin{background:#4a86c0;color:#fff}.pc.t-steel{background:#9cc9e6;color:#123}.pc.t-brick{background:#b9533a;color:#fff}.pc.t-rc{background:#b8b4ac;color:#222}.pc.t-box{background:#d9772b;color:#fff}.pc.t-loft{background:#6a5acd;color:#fff}.pc.t-frame{background:#8d98a3;color:#fff}.pc.t-garden{background:#56a35f;color:#fff}.pc.t-sign{background:#e0457a;color:#fff}.pc.t-stair,.pc.t-core{background:#6d7277;color:#fff}.pc.t-tank{background:#d5dce2;color:#222}.pc.t-balc{background:#d9d2c3;color:#222;opacity:1;border-style:solid}
.dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:1.5px solid #101828;display:grid;place-items:center;pointer-events:none;z-index:3}
.dot span{transform:rotate(45deg);font:400 10px "DotGothic16",monospace}
.dot.g{background:#6fd083;color:#0d1a10}.dot.y{background:#f4c430;color:#1d1600}.dot.r{background:#d8382c;color:#fff}
.ecc{position:absolute;border:2px dashed var(--ink);pointer-events:none;z-index:4}
.ecc.bad{border-color:var(--red)}
.com{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff);pointer-events:none;z-index:5;transition:left .25s,top .25s}
.com::before,.com::after{content:"";position:absolute;background:var(--ink);left:5.5px;top:0;width:3px;height:14px}
.com::after{left:0;top:5.5px;width:14px;height:3px}
.com.bad::before,.com.bad::after{background:var(--red)}

/* 對話框：從下方滑出 */
.modal{position:fixed;inset:0;background:rgba(8,12,20,.62);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.card{background:var(--panel);max-width:560px;width:100%;border-top:5px solid var(--red);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;animation:cardIn .28s cubic-bezier(.2,1.2,.4,1);max-height:88vh;overflow-y:auto}
@keyframes cardIn{from{transform:translateY(60%);opacity:0}}
.card h3{font:400 28px/1.15 "DotGothic16","Noto Sans TC",monospace;margin:0 0 8px}
.card .big{font-size:52px;letter-spacing:8px;margin:0 0 4px;height:66px}
.card .big span{display:inline-block;color:var(--line)}
.card .big span.lit{color:var(--yel);text-shadow:0 3px 0 #8a6a00;animation:starIn .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes starIn{from{transform:scale(2.6) rotate(-30deg);opacity:0}}
.card p{margin:0 0 10px;text-align:left}
.card p.c{text-align:center}
.card .hint{background:color-mix(in srgb,var(--yel) 22%,transparent);padding:8px 10px;border-left:4px solid var(--yel)}
.card ul{text-align:left;margin:0 0 10px;padding-left:20px}
.card .mAct{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:12px}
/* 版面：左邊 3D、右邊平面圖（窄螢幕改成上下） */
#game{gap:5px;padding:5px 5px calc(6px + env(safe-area-inset-bottom,0px))}
.hud{position:static;flex:none;border:3px solid var(--deep);background:var(--navy);padding:2px 10px 5px}
.hud .num{font-size:28px}
.stageWrap{flex:1;display:flex;flex-direction:column;gap:5px;min-height:180px;border:0;background:none;overflow:visible}
.pane3d{flex:1.3 1 0;position:relative;border:3px solid var(--deep);overflow:hidden;min-height:0;min-width:0}
.planPane{flex:1 1 0;display:flex;flex-direction:column;gap:3px;border:3px solid var(--deep);background:var(--panel);min-height:0;min-width:0;padding:4px}
.stageWrap{flex-direction:row}.pane3d{flex:1.15 1 0}
.chips{position:static;justify-content:center;gap:3px;flex:none}
.chips{gap:2px}
.chip{font-size:11px;padding:0 4px;border-width:1.5px;gap:1px;line-height:1.6}
.planBox{flex:1;min-height:0;min-width:0;display:grid;place-items:center;overflow:hidden}
.plan{touch-action:none}
.pc span{font:400 1em "DotGothic16",monospace}
.dots{position:absolute;inset:0;pointer-events:none}
.dot.up{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px #101828;z-index:6;animation:bump .3s}
#tip{position:static;flex:none;height:40px;overflow:hidden;border:3px solid var(--deep);background:var(--navy);padding:2px 8px;font-size:12.5px;line-height:1.35}
#tip.bad{background:#961c14}
#bRot{bottom:6px;right:6px}
.dock{padding:9px 4px 5px;gap:6px}
.piece{width:68px}
.piece img,.piece canvas{width:40px;height:40px}
.row{grid-template-columns:1fr 1fr 1fr 1.9fr;align-items:stretch}
.row .go{font-size:16px;letter-spacing:1px;min-height:48px;padding:2px 4px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<section id="menu" class="col">
  <div class="hero">
    <div id="heroSlot"></div>
    <div class="txt">
      <h1>違建大亨 3D</h1>
      <p>阿公的老公寓屋頂空著。往上加蓋收租，但每根角柱都有極限、每間房都要逃得出去、每扇窗都要看得到天空。</p>
      <div class="tot" id="totStars"></div>
    </div>
  </div>
  <div id="chapters"></div>
  <div class="rules">
    <h2>規則一覽</h2>
    <ol>
      <li><b>承重：</b>每格重量平均分給四個角柱；柱子的負重是它上方所有東西壓下來的總和。任何一段超載就會塌。</li>
      <li><b>逃生：</b>每間房都要沿著同一層走得到樓梯。</li>
      <li><b>採光：</b>四面都被實牆擋住的房間是暗房，租金 0。架空層、花園、陽台、樓梯不擋光。</li>
      <li><b>配重：</b>外推陽台貼著的那間房（含上面樓層）總重要 ≥ 8。</li>
      <li><b>日照斜線：</b>橘色範圍不能蓋。每高一層，房間租金 +1。</li>
      <li><b>耐震</b>（部分關卡）：所有加蓋的重心要落在平面圖的虛線框內。</li>
    </ol>
  </div>
</section>

<section id="game" class="col">
  <div class="top">
    <button class="b sm" id="bMenu" aria-label="回選關">←</button>
    <h2 id="gName"></h2>
    <button class="b sm" id="bHelp" aria-label="關卡說明">？</button>
    <button class="b sm" id="bSound" aria-label="音效開關">♪</button>
  </div>
  <div class="hud">
    <div><span class="num" id="gRent">0</span><small>租金</small><span class="delta" id="gDelta"></span></div>
    <div><div class="goal" id="gGoal"></div><div class="meterBar" id="gBar"></div></div>
  </div>

<script>
// 違建大亨 3D：規則引擎 v2（瀏覽器與 Node 共用）
(function(root){
const TYPES = {
  tin:   {name:'鐵皮屋',   w:[4],   cap:2, rent:1, room:true, walk:true, desc:'輕，但柱子很細'},
  steel: {name:'輕鋼構',   w:[4],   cap:4, rent:1, room:true, walk:true, desc:'輕又強，適合墊在下面'},
  brick: {name:'磚造加蓋', w:[8],   cap:5, rent:2, room:true, walk:true, desc:'重，柱子粗，租金 2'},
  rc:    {name:'RC 加蓋',  w:[12],  cap:8, rent:3, room:true, walk:true, desc:'最重最強，租金 3'},
  box:   {name:'貨櫃屋',   w:[8,8], cap:3, rent:3, room:true, walk:true, shape:'h2', desc:'橫佔兩格，按 R 旋轉'},
  loft:  {name:'樓中樓',   w:[8,4], cap:5, rent:4, perLv:2, room:true, walk:true, shape:'v2', desc:'直佔兩層，裡面有室內梯，可以當樓梯走'},
  frame: {name:'架空層',   w:[4],   cap:6, rent:0, walk:true, open:true, desc:'不收租，但強、輕、不擋光、可以走'},
  garden:{name:'空中花園', w:[8],   cap:0, rent:0, walk:true, open:true, noTop:true, noSeg:true, desc:'旁邊每間房租金 +1，不擋光，很重'},
  sign:  {name:'廣告招牌', w:[4],   cap:0, rent:1, perLv:2, noTop:true, noSeg:true, onlyOn:['brick','rc'], desc:'只能鎖在磚造或 RC 上面，越高越賺，會擋光'},
  balc:  {name:'外推陽台', w:[4],   cap:0, rent:2, open:true, noTop:true, hang:true, desc:'掛在房間外側，那間房要夠重才壓得住'},
  stair: {name:'樓梯',     w:[4],   cap:4, rent:0, walk:true, open:true, stair:true, desc:'只能接在樓梯正上方，讓上層能逃生'},
  core:  {name:'樓梯間',   w:[4],   cap:6, rent:0, walk:true, stair:true, fixed:true, desc:'原有的樓梯出口'},
  tank:  {name:'水塔',     w:[8],   cap:6, rent:0, noTop:true, fixed:true, desc:'阿公的，不能動，上面不能蓋'},
};
const POST = 3, BALC_NEED = 8;
const k3 = (x,z,lv) => x + ',' + z + ',' + lv;
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

function cells(b){
  const T = TYPES[b.type];
  if(T.shape === 'h2') return b.rot ? [{x:b.x,z:b.z,lv:b.lv,w:T.w[0]},{x:b.x,z:b.z+1,lv:b.lv,w:T.w[1]}] : [{x:b.x,z:b.z,lv:b.lv,w:T.w[0]},{x:b.x+1,z:b.z,lv:b.lv,w:T.w[1]}];
  if(T.shape === 'v2') return [{x:b.x,z:b.z,lv:b.lv,w:T.w[0]},{x:b.x,z:b.z,lv:b.lv+1,w:T.w[1]}];
  return [{x:b.x,z:b.z,lv:b.lv,w:T.w[0]}];
}
function isVoid(L,x,z){ return !!(L.voids && L.voids.some(v => v[0] === x && v[1] === z)); }
function inside(L,x,z){ return x >= 0 && x < L.W && z >= 0 && z < L.D && !isVoid(L,x,z); }
function hmax(L,x,z){ const h = L.hmax && L.hmax[z] ? L.hmax[z][x] : undefined; return h === undefined ? L.top : h; }
function occMap(blocks){ const m = new Map(); for(const b of blocks) for(const c of cells(b)) m.set(k3(c.x,c.z,c.lv), {b, w:c.w}); return m; }
function corners(x,z){ return [[x,z],[x+1,z],[x,z+1],[x+1,z+1]]; }
function anchorOf(L, b, occ){
  for(const [dx,dz] of DIRS){ const ax = b.x+dx, az = b.z+dz; if(inside(L,ax,az)){ const o = occ.get(k3(ax,az,b.lv)); if(o && TYPES[o.b.type].room) return {a:o.b, ax, az}; } }
  return null;
}
function colHeight(occ,x,z){ let h = 0; while(occ.has(k3(x,z,h))) h++; return h; }

// 放置檢查：回傳 '' 代表可以
function canPlace(L, blocks, inv, p, occ){
  const T = TYPES[p.type]; if(!T) return '未知零件';
  if((inv[p.type] || 0) <= 0) return '這種零件用完了';
  occ = occ || occMap(blocks);
  if(p.lv < 0 || p.lv >= L.top) return '超出可以蓋的高度';
  if(T.hang){
    if(inside(L,p.x,p.z)) return '陽台要懸空掛在屋頂外面：點房間的外側面';
    if(occ.has(k3(p.x,p.z,p.lv))) return '這裡已經有陽台了';
    if(!anchorOf(L,p,occ)) return '陽台要貼著同一層的房間';
    return '';
  }
  for(const c of cells(p)){
    if(!inside(L,c.x,c.z)) return isVoid(L,c.x,c.z) ? '這裡是天井，不能蓋' : '超出屋頂範圍';
    if(occ.has(k3(c.x,c.z,c.lv))) return '這格已經有東西了';
    if(c.lv >= L.top) return '超出可以蓋的高度';
    if(c.lv >= hmax(L,c.x,c.z)) return '這格在日照斜線範圍內，會擋到陳阿姨家的太陽';
    if(c.lv !== p.lv) continue;
    if(c.lv === 0){
      if(T.stair) return '樓梯只能接在樓梯間正上方';
      if(T.onlyOn) return '招牌要鎖在磚造或 RC 加蓋的上面';
      continue;
    }
    const o = occ.get(k3(c.x,c.z,c.lv-1));
    if(!o) return '下面是空的，要先蓋下面那層';
    const B = TYPES[o.b.type];
    if(B.noTop) return B.name + '上面不能蓋東西';
    if(T.stair && !B.stair) return '樓梯只能接在樓梯正上方';
    if(!T.stair && B.stair) return '樓梯上面只能再接樓梯';
    if(T.onlyOn && !T.onlyOn.includes(o.b.type)) return '招牌要鎖在磚造或 RC 加蓋的上面';
  }
  return '';
}
function canRemove(L, blocks, b, occ){
  if(b.locked) return '這是原本就有的，不能拆';
  occ = occ || occMap(blocks);
  for(const c of cells(b)){ const o = occ.get(k3(c.x,c.z,c.lv+1)); if(o && o.b !== b) return '上面還有東西，要先拆上面'; }
  for(const o of blocks) if(TYPES[o.type].hang){ const an = anchorOf(L,o,occ); if(an && an.a === b){ const rest = blocks.filter(q => q !== b); if(!anchorOf(L,o,occMap(rest))) return '有陽台掛在這間房上，要先拆陽台'; } }
  return '';
}

// 受力：所有柱段
function segments(L, blocks, posts){
  posts = posts || {};
  const occ = occMap(blocks), contrib = new Map(), capAt = new Map();
  const add = (cx,cz,lv,amt) => { const k = cx+','+cz; if(!contrib.has(k)) contrib.set(k, []); contrib.get(k).push([lv,amt]); };
  for(const b of blocks){
    const T = TYPES[b.type];
    if(T.hang){
      const an = anchorOf(L,b,occ); if(!an) continue;
      const mine = corners(b.x,b.z);
      for(const [cx,cz] of corners(an.ax,an.az)) if(mine.some(q => q[0] === cx && q[1] === cz)) add(cx,cz,b.lv, T.w[0]/2);
      continue;
    }
    for(const c of cells(b)) for(const [cx,cz] of corners(c.x,c.z)){
      add(cx,cz, T.noSeg ? c.lv-1 : c.lv, c.w/4);
      if(!T.noSeg){ const kk = cx+','+cz+','+c.lv; capAt.set(kk, (capAt.get(kk) || 0) + T.cap); }
    }
  }
  const segs = [];
  for(let cz = 0; cz <= L.D; cz++) for(let cx = 0; cx <= L.W; cx++){
    if(!corners(cx-1,cz-1).some(([x,z]) => inside(L,x,z))) continue;
    const list = contrib.get(cx+','+cz) || [];
    const total = list.reduce((s,q) => s + q[1], 0);
    const pr = posts[cx+','+cz+',-1'] || 0;
    segs.push({cx, cz, lv:-1, key:cx+','+cz+',-1', load:total, cap:L.rcCap[cz][cx] + pr*POST, posts:pr});
    for(let lv = 0; lv < L.top; lv++){
      const kk = cx+','+cz+','+lv; if(!capAt.has(kk)) continue;
      const load = list.reduce((s,q) => s + (q[0] >= lv ? q[1] : 0), 0), p = posts[kk] || 0;
      segs.push({cx, cz, lv, key:kk, load, cap:capAt.get(kk) + p*POST, posts:p});
    }
  }
  return segs;
}

// 全面檢核
function evaluate(L, blocks, posts){
  const occ = occMap(blocks), segs = segments(L, blocks, posts);
  const over = segs.filter(s => s.load > s.cap);
  // 逃生：從樓梯出發，沿同一層相鄰的可通行方塊擴散
  const dist = new Map(), queue = [];
  for(const b of blocks) if(TYPES[b.type].stair){ dist.set(b, 0); queue.push(b); }
  while(queue.length){
    const b = queue.shift();
    for(const c of cells(b)) for(const [dx,dz] of DIRS){
      const o = occ.get(k3(c.x+dx,c.z+dz,c.lv));
      if(o && TYPES[o.b.type].walk && !dist.has(o.b)){ dist.set(o.b, dist.get(b)+1); queue.push(o.b); }
    }
  }
  const rooms = blocks.filter(b => TYPES[b.type].room);
  const lost = rooms.filter(b => !dist.has(b));
  // 採光：任一側沒被實牆擋住就有窗
  const dark = rooms.filter(b => {
    for(const c of cells(b)) for(const [dx,dz] of DIRS){
      const o = occ.get(k3(c.x+dx,c.z+dz,c.lv));
      if(o && o.b === b) continue;
      if(!o || TYPES[o.b.type].open) return false;
    }
    return true;
  });
  // 配重
  const weak = [];
  for(const b of blocks) if(TYPES[b.type].hang){
    const an = anchorOf(L,b,occ); let have = 0;
    if(an) for(let lv = b.lv; lv < L.top; lv++){ const o = occ.get(k3(an.ax,an.az,lv)); if(!o) break; have += o.w; }
    if(have < BALC_NEED) weak.push({b, have});
  }
  // 耐震：重心偏移
  let centroid = null;
  if(L.ecc){
    let W = 0, X = 0, Z = 0;
    for(const b of blocks) for(const c of cells(b)){ W += c.w; X += c.w*(c.x+.5); Z += c.w*(c.z+.5); }
    const x = W ? X/W : L.W/2, z = W ? Z/W : L.D/2;
    centroid = {x, z, tol:L.ecc, ok: Math.abs(x - L.W/2) <= L.ecc + 1e-9 && Math.abs(z - L.D/2) <= L.ecc + 1e-9};
  }
  // 租金
  const darkSet = new Set(dark);
  const rentOf = b => {
    const T = TYPES[b.type];
    if(b.type === 'garden'){ const seen = new Set(); for(const [dx,dz] of DIRS){ const o = occ.get(k3(b.x+dx,b.z+dz,b.lv)); if(o && TYPES[o.b.type].room) seen.add(o.b); } return seen.size; }
    if(darkSet.has(b)) return 0;
    return T.rent + ((T.room || T.perLv) ? b.lv*(T.perLv || 1) : 0);
  };
  const rent = blocks.reduce((s,b) => s + rentOf(b), 0);
  const ok = !over.length && !lost.length && !weak.length && (!centroid || centroid.ok);
  return {segs, over, lost, dark, weak, centroid, rent, rentOf, dist, ok};
}
function postsNeeded(L, blocks){
  let n = 0; const plan = {};
  for(const s of segments(L, blocks, {})) if(s.load > s.cap){ const k = Math.ceil((s.load - s.cap)/POST); n += k; plan[s.key] = k; }
  return {n, plan};
}
const api = {TYPES, POST, BALC_NEED, cells, canPlace, canRemove, segments, evaluate, postsNeeded, occMap, inside, isVoid, hmax, anchorOf, corners, colHeight, k3};
if(typeof module !== 'undefined' && module.exports) module.exports = api; else root.Rules = api;
})(this);

</script>

planEl.addEventListener('pointerup', e => { if(!planDown) return; planDown = false; const c = planCellAt(e); if(c) planTap(+c.dataset.x, +c.dataset.z); else setHover(null); });
planEl.addEventListener('pointercancel', () => { planDown = false; setHover(null); });
new ResizeObserver(() => { if(mode === 'game' && L && st) renderPlan(); }).observe($('planBox'));
// --- 受力數字 ---
function drawLabels(){
  const box = $('labels'); if(mode !== 'game' || !lastEval){ box.innerHTML = ''; return; }
  const src = after || lastEval, crit = new Map(); let html = '';
  if(showLabels) for(const s of src.segs){ if(!(s.load > 0)) continue; const k = s.cx + ',' + s.cz, c = crit.get(k), r = s.load/Math.max(.01, s.cap); if(!c || r > c.r) crit.set(k, {r, key:s.key}); }
  const keep = new Set([...crit.values()].map(c => c.key));
  for(const s of src.segs){
    const over = s.load > s.cap; if(!(over || keep.has(s.key))) continue;
    const p = screenOf(new THREE.Vector3(s.cx, s.lv < 0 ? roofY - .22 : roofY + s.lv*LV + .5, s.cz)), r = s.cap ? s.load/s.cap : 9;
    html += `<span class="lab ${over ? 'r' : r >= .75 ? 'y' : 'g'}" style="left:${p.x.toFixed(0)}px;top:${p.y.toFixed(0)}px">${s.load}/${s.cap}</span>`;
  }
  box.innerHTML = html;
}
// --- 對話框 ---
const modalEl = $('modal');
function modal(t, html, btns){
  $('mT').textContent = t; $('mB').innerHTML = html; const a = $('mA'); a.innerHTML = '';
  for(const [label, fn, primary] of btns){ const b = document.createElement('button'); b.className = 'b' + (primary ? ' go' : ''); b.textContent = label; b.onclick = () => { SFX.click(); fn(); }; a.appendChild(b); }
  modalEl.classList.add('show');
}
function closeModal(){ modalEl.classList.remove('show'); }
function introModal(first){
  const inv = toolsOf().map(k => `${k === 'post' ? '鋼柱' : TYPES[k].name} ×${L.inv[k]}`).join('、');
  modal(`第 ${li+1} 關　${L.name}`, `<p>${L.story}</p><p class="hint">${esc(L.hint)}</p><p><b>零件：</b>${inv}</p><p><b>過關：</b>驗收通過，而且租金至少 ${L.stars[0]}（三星 ${L.stars[2]}）。</p>${first ? '' : '<ul><li>左邊是透視圖，右邊是平面圖，兩邊都可以點：手指按住滑動可以預覽，放開就蓋下去。</li><li>平面圖格子裡的數字＝已蓋幾層；<b>圓點＝那根柱子最吃緊的一段還能再扛多少</b>，預覽時會先變成蓋下去之後的數字。</li><li>虛線外圈放陽台，橘框是日照斜線有限高，十字是重心。</li><li>「透視」讓方塊變半透明；「受力數字」在透視圖上顯示每根柱子的負重。</li></ul>'}`,
    first ? [['開始蓋', closeModal, 1]] : [['全部拆掉', () => { closeModal(); resetAll(); }], ['繼續', closeModal, 1]]);
}

function moveCanvas(to){ slot = to; to.appendChild(cvs); }
function clearBlocks(){ meshes.clear(); clearGroup(blockGroup); clearGroup(fxGroup); colMeshes = []; markView = []; confetti = []; tweens.length = 0; }
function startLevel(i){
  li = i; L = LEVELS[i]; st = newState(L); hist = []; mode = 'game'; hover = null; hoverKey = ''; xray = false; chipState = null; flashKeys = new Set(); lastCounts = {}; rentShown = 0; busy = false;
  tool = ['tin','steel','brick','rc','box'].find(k => (L.inv[k] || 0) > 0) || toolsOf()[0];
  $('menu').style.display = 'none'; $('game').style.display = 'flex';
  $('gName').innerHTML = `${li+1}・${esc(L.name)}<small>${esc(L.sub)}</small>`;
  clearBlocks(); moveCanvas(stageSlot); buildEnv(L); fitCamera(); world.rotation.set(0,0,0); refresh();
  window.scrollTo(0, 0); introModal(true);
}
const DEMO = {id:'demo', ch:2, W:3, D:3, top:4, rcCap:[[9,9,9,9],[9,9,9,9],[9,9,9,9],[9,9,9,9]], inv:{}, blocks:[
  {type:'core',x:0,z:0,lv:0},{type:'stair',x:0,z:0,lv:1},{type:'stair',x:0,z:0,lv:2},{type:'brick',x:1,z:0,lv:0},{type:'rc',x:2,z:0,lv:0},{type:'sign',x:2,z:0,lv:1},{type:'steel',x:1,z:0,lv:1},{type:'tin',x:1,z:0,lv:2},
  {type:'box',x:0,z:1,lv:0,rot:1},{type:'garden',x:1,z:1,lv:0},{type:'loft',x:2,z:1,lv:0},{type:'frame',x:1,z:2,lv:0},{type:'brick',x:1,z:2,lv:1},{type:'tin',x:2,z:2,lv:0},{type:'tank',x:2,z:2,lv:1},{type:'tin',x:0,z:1,lv:1},{type:'balc',x:-1,z:1,lv:0},{type:'balc',x:1,z:-1,lv:0},{type:'balc',x:3,z:1,lv:1}]};
function showMenu(){
  mode = 'menu'; closeModal(); $('menu').style.display = 'block'; $('game').style.display = 'none'; $('labels').innerHTML = ''; hover = null; prop = null; after = null; clearGroup(ghostGroup);
  L = DEMO; xray = false; tool = 'tin'; st = {blocks:DEMO.blocks.map(b => Object.assign({rot:0}, b, {id:'d'+(nid++)})), posts:{}, inv:{}};
  clearBlocks(); moveCanvas(heroSlot); buildEnv(L); heroSlot.className = 'sky-dusk'; fitCamera(); world.rotation.set(0,0,0);
  lastEval = Rules.evaluate(L, st.blocks, {}); syncBlocks({lost:[], dark:[], weak:[]}); while(statusGroup.children.length) statusGroup.children.pop(); while(overlayGroup.children.length) overlayGroup.children.pop();
  const total = LEVELS.reduce((s, lv) => s + (stars[lv.id] || 0), 0);
  $('totStars').textContent = `★ ${total} / ${LEVELS.length*3}`;
  $('chapters').innerHTML = CHAPTERS.map((ch, ci) => {
    const lvs = LEVELS.map((lv, i) => [lv, i]).filter(q => q[0].ch === ci), got = lvs.reduce((s, q) => s + (stars[q[0].id] || 0), 0);
    return `<div class="chap"><span>${esc(ch.name)}</span><small>★ ${got}/${lvs.length*3}</small></div><div class="levels">` + lvs.map(([lv, i]) => { const s = stars[lv.id] || 0; let mini = ''; for(let x = lv.W - 1; x >= 0; x--) for(let z = 0; z < lv.D; z++) mini += `<i class="${Rules.inside(lv, x, z) ? '' : 'v'}"></i>`;
      return `<button class="lv" data-i="${i}"><b>第 ${i+1} 關・${esc(lv.sub)}</b><span class="mini" style="grid-template-columns:repeat(${lv.D},8px)">${mini}</span><span class="n">${esc(lv.name)}</span><span class="st">${'★'.repeat(s)}<i>${'★'.repeat(3-s)}</i></span></button>`; }).join('') + '</div>';
  }).join('');
  document.querySelectorAll('.lv').forEach(b => b.onclick = () => { SFX.unlock(); SFX.click(); startLevel(+b.dataset.i); });
}
// --- 按鈕 ---
$('bUndo').onclick = () => { SFX.unlock(); undo(); };
$('bMenu').onclick = () => { SFX.click(); showMenu(); };
$('bHelp').onclick = () => { SFX.click(); introModal(false); };
$('bCheck').onclick = () => { SFX.unlock(); verify(); };
$('bRot').onclick = () => { rot = 1 - rot; SFX.select(); flashTip(rot ? '貨櫃方向：往右後方' : '貨櫃方向：往左後方'); tipEl.classList.remove('bad'); };
$('bLab').onclick = () => { showLabels = !showLabels; SFX.click(); renderDock(); drawLabels(); };
$('bXray').onclick = () => { xray = !xray; SFX.click(); for(const [, m] of meshes) applyTint(m); renderDock(); };
const sndLabel = () => { $('bSound').style.opacity = SFX.muted ? .45 : 1; $('bSound').setAttribute('aria-pressed', String(!SFX.muted)); };
$('bSound').onclick = () => { SFX.toggle(); sndLabel(); SFX.unlock(); SFX.select(); };
sndLabel();

// ===== 迴圈 =====
function loop(t){
  for(let i = tweens.length - 1; i >= 0; i--){ const w = tweens[i], k = Math.min(1, (t - w.t)/w.dur); w.fn(k); if(k >= 1){ tweens.splice(i, 1); if(w.done) w.done(); } }
  if(mode === 'menu'){ menuYaw += .003; fitCamera(); }
  world.position.set(0,0,0);
  if(t < shakeT){ const a = shakeT - t > 200 ? .07 : .025; world.position.set((Math.random()-.5)*a, 0, (Math.random()-.5)*a); }
  if(fx.quake){ const e = t - fx.quake; world.rotation.z = Math.sin(e/55)*fx.quakeAmp*Math.max(0, 1 - e/800); }
  ghostGroup.position.y = .06 + Math.sin(t/180)*.04;
  // 方塊發光狀態
  for(const [id, m] of meshes){
    const s = m.userData.status || {}; let r = 0, g = 0, b = 0;
    if(s.lost || s.weak) r += .28 + .22*Math.sin(t/150);
    if(fx.egress && fx.egDist){ const d = fx.egDist.get(id); if(d !== undefined){ const k = Math.max(0, 1 - Math.abs(t - fx.egress - d*110 - 90)/220); g += .75*k; } }
    if(fx.light && s.room && !s.dark){ const k = Math.sin(Math.min(1, (t - fx.light)/460)*Math.PI); r += .5*k; g += .42*k; }
    if(fx.weight && s.type === 'balc'){ m.position.y = s.home.y + Math.abs(Math.sin((t - fx.weight)/70))*.12; }
    for(const mt of m.userData.mats) if(mt.emissive) mt.emissive.setRGB(r, g, b);
    if(m.userData.sway) m.userData.sway.rotation.z = Math.sin(t/900 + m.position.x)*.05;
    if(m.userData.neon) m.userData.neon.color.setScalar((Math.floor(t/400)%7 === 0) ? .55 : 1);
  }
  for(const m of colMeshes){ const s = m.userData.seg; let k = 1; if(m.userData.over) k = 1.5 + .6*Math.sin(t/110); if(fx.load){ k += 1.6*Math.max(0, 1 - Math.abs((t - fx.load)/85 - (s.lv + 1.5))); } m.scale.set(k, 1, k); }
  if(envGroup && envGroup.userData.tree) envGroup.userData.tree.rotation.z = Math.sin(t/1100)*.03;
  confetti = confetti.filter(c => { c.v.y -= .006; c.m.position.add(c.v); c.m.rotation.x += .2; c.m.rotation.y += .13; if(--c.life <= 0){ fxGroup.remove(c.m); c.m.geometry.dispose(); c.m.material.dispose(); return false; } return true; });
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
makeIcons(); showMenu();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { delete texCache.sign; delete texCache.shop; requestAnimationFrame(loop); });
window.__g = {startLevel, get st(){ return st; }, get L(){ return L; }, LEVELS, place(p){ const why = Rules.canPlace(L, st.blocks, st.inv, p); if(why) return why; st.blocks.push(Object.assign({}, p, {id:'b'+(nid++)})); st.inv[p.type]--; refresh(); return ''; }, post(k){ st.posts[k] = (st.posts[k] || 0) + 1; st.inv.post--; refresh(); }, eval:() => Rules.evaluate(L, st.blocks, st.posts), verify, labels(v){ showLabels = v; drawLabels(); }, tool:k => selectTool(k), closeModal, screenOf:(x,y,z) => screenOf(new THREE.Vector3(x,y,z)), roofY};
}
